name: Move JOES staging templates

on:
  push:
    paths:
      - 'static/JOES/**'
      - '.github/workflows/move-joes-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Move JOES files into their proper libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p templates static/fonts static/design-assets
          shopt -s nullglob
          moved=0

          for file in static/JOES/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"

            case "$name" in
              *.html|*.htm)
                target="templates/$name"
                if [ -e "$target" ]; then
                  base="${target%.*}"
                  ext="${target##*.}"
                  n=2
                  while [ -e "${base}-$n.$ext" ]; do n=$((n+1)); done
                  target="${base}-$n.$ext"
                fi
                mv "$file" "$target"
                moved=1
                ;;

              *.zip|*.ZIP)
                stem="${name%.*}"
                work=".joes-work/$stem"
                rm -rf "$work"
                mkdir -p "$work"
                unzip -q "$file" -d "$work"

                found=0
                while IFS= read -r src; do
                  [ -f "$src" ] || continue
                  rel="${src#"$work"/}"
                  base_name="$(basename "$src")"
                  lower="$(printf '%s' "$base_name" | tr '[:upper:]' '[:lower:]')"

                  case "$lower" in
                    *.html|*.htm)
                      target="templates/$base_name"
                      if [ -e "$target" ]; then
                        base="${target%.*}"
                        ext="${target##*.}"
                        n=2
                        while [ -e "${base}-$n.$ext" ]; do n=$((n+1)); done
                        target="${base}-$n.$ext"
                      fi
                      mkdir -p "$(dirname "$target")"
                      cp -f "$src" "$target"
                      found=1
                      ;;

                    *.ttf|*.otf|*.woff|*.woff2)
                      target="static/fonts/$base_name"
                      if [ -e "$target" ]; then
                        base="${target%.*}"
                        ext="${target##*.}"
                        n=2
                        while [ -e "${base}-$n.$ext" ]; do n=$((n+1)); done
                        target="${base}-$n.$ext"
                      fi
                      mkdir -p "$(dirname "$target")"
                      cp -f "$src" "$target"
                      found=1
                      ;;

                    *.psd|*.psb|*.ai|*.eps|*.svg|*.png|*.jpg|*.jpeg|*.webp|*.gif|*.bmp|*.tif|*.tiff|*.pdf|*.cdr|*.indd|*.idml|*.abr)
                      target="static/design-assets/$stem/$rel"
                      mkdir -p "$(dirname "$target")"
                      cp -f "$src" "$target"
                      found=1
                      ;;
                  esac
                done < <(find "$work" -type f -print)

                if [ "$found" -eq 1 ]; then
                  rm -f "$file"
                  moved=1
                else
                  echo "No supported assets found in $name; leaving archive in static/JOES."
                fi
                rm -rf "$work"
                ;;

              *)
                echo "Leaving unsupported staging file: $name"
                ;;
            esac
          done

          rm -rf .joes-work

          if [ "$moved" -eq 0 ]; then
            echo "No JOES files needed moving."
            exit 0
          fi

          git config user.name "Joes Studio"
          git config user.email "actions@users.noreply.github.com"
          git add -A static/JOES templates static/fonts static/design-assets
          git diff --cached --quiet && exit 0
          git commit -m "Move JOES staging files into proper libraries"
          git push
