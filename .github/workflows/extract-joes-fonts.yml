name: Extract JOES fonts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[joes-fonts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract font archive
        shell: bash
        run: |
          set -e
          mkdir -p static/fonts
          unzip -o static/fonts/FONT.zip -d static/fonts/extracted
          find static/fonts/extracted -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -exec cp -f {} static/fonts/ \;
          rm -rf static/fonts/extracted static/fonts/FONT.zip
          test "$(find static/fonts -type f | wc -l)" -gt 0
      - name: Commit extracted fonts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/fonts .github/workflows/extract-joes-fonts.yml
          git rm -f .github/workflows/extract-joes-fonts.yml
          git commit -m "[joes-fonts] Extract JOES font archive" || exit 0
          git push
