name: Install Student Template Loader

on:
  push:
    paths:
      - 'static/student-template-loader.js'
      - '.github/workflows/install-student-template-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject loader into app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./static/student-template-loader.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Loader already installed.'
          else
            git commit -m 'Wire student template loader into app'
            git push
          fi
