<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOES STUDIO Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5e7eb}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1400px;margin:auto;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-family:Georgia,serif;font-size:28px;font-weight:800;letter-spacing:1px}.muted{color:#94a3b8}
.grid{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel,.stat{background:#111827;border:1px solid #263244;border-radius:16px;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat b{display:block;font-size:28px;margin-top:7px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{width:100%;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:9px;padding:10px}.toolbar input{max-width:330px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#d6b36a;color:#111827;font-weight:800}.btn.dark{background:#243044;color:#e5e7eb}.btn.danger{background:#7f1d1d;color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #263244;font-size:14px}.badge{padding:4px 8px;border-radius:999px;background:#243044}.active{background:#14532d}.pending{background:#713f12}.banned{background:#7f1d1d}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}
.form{display:grid;gap:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.login{max-width:420px;margin:12vh auto}.count{font-variant-numeric:tabular-nums;color:#d6b36a;font-weight:800}.side h3{margin-top:0}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body>
<div id="login" class="panel login"><div class="brand">JOES STUDIO</div><p class="muted">Administration Console</p>
<form id="loginForm" class="form"><input id="user" placeholder="Admin username" autocomplete="username" required><input id="pass" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="btn">Sign in</button><div id="loginErr" class="muted"></div></form></div>
<div id="app" class="shell hidden"><div class="top"><div><div class="brand">JOES STUDIO</div><div class="muted">Subscription Administration</div></div><button id="logout" class="btn dark">Log out</button></div>
<div class="stats"><div class="stat">Total<b id="total">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Active<b id="active">0</b></div><div class="stat">Banned<b id="banned">0</b></div></div>
<div class="grid"><aside class="panel side"><h3>Subscription</h3><form id="form" class="form"><input id="id" type="hidden"><input id="name" placeholder="Customer name"><input id="email" type="email" placeholder="Email" required><div class="formgrid"><select id="plan"><option>monthly</option><option>quarterly</option><option>annual</option><option>custom</option></select><select id="status"><option>pending</option><option>active</option><option>expired</option><option>cancelled</option></select></div><div class="formgrid"><label class="muted">Start<input id="startAt" type="datetime-local"></label><label class="muted">End<input id="endAt" type="datetime-local"></label></div><label><input id="bannedCheck" type="checkbox" style="width:auto"> Banned</label><textarea id="notes" rows="4" placeholder="Notes"></textarea><button class="btn">Save subscription</button><button type="button" id="new" class="btn dark">New</button></form></aside>
<main class="panel"><div class="toolbar"><input id="search" placeholder="Search name or email"><button id="refresh" class="btn dark">Refresh</button></div><table><thead><tr><th>Customer</th><th>Plan</th><th>Status</th><th>Countdown</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></main></div></div>
<script>
let items=[];
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function localValue(s){return s?new Date(s).toISOString().slice(0,16):""}
function countdown(end,banned){if(banned)return "BANNED";if(!end)return "No expiry";let ms=new Date(end)-Date.now();if(ms<=0)return "Expired";let d=Math.floor(ms/86400000),h=Math.floor(ms/3600000)%24,m=Math.floor(ms/60000)%60;return d+"d "+h+"h "+m+"m"}
function render(){const q=$("search").value.toLowerCase();const list=items.filter(x=>(x.name+" "+x.email).toLowerCase().includes(q));$("total").textContent=items.length;$("pending").textContent=items.filter(x=>x.status==="pending").length;$("active").textContent=items.filter(x=>x.status==="active").length;$("banned").textContent=items.filter(x=>x.banned).length;
$("rows").innerHTML=list.map(x=>`<tr><td><b>${esc(x.name||"Unnamed")}</b><br><span class="muted">${esc(x.email)}</span></td><td>${esc(x.plan)}</td><td><span class="badge ${x.banned?"banned":x.status}">${x.banned?"BANNED":esc(x.status)}</span></td><td class="count">${countdown(x.endAt,x.banned)}</td><td class="row-actions"><button class="btn" onclick="editItem('${x.id}')">Edit</button><button class="btn dark" onclick="quick('${x.id}','${x.banned?"unban":"ban"}')">${x.banned?"Unban":"Ban"}</button><button class="btn danger" onclick="removeItem('${x.id}')">Delete</button></td></tr>`).join("")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function fill(x){$("id").value=x?.id||"";$("name").value=x?.name||"";$("email").value=x?.email||"";$("plan").value=x?.plan||"monthly";$("status").value=x?.status||"pending";$("startAt").value=localValue(x?.startAt);$("endAt").value=localValue(x?.endAt);$("bannedCheck").checked=!!x?.banned;$("notes").value=x?.notes||""}
async function load(){try{const d=await api("/api/admin");items=d.subscriptions||[];$("login").classList.add("hidden");$("app").classList.remove("hidden");render()}catch(e){$("login").classList.remove("hidden");$("app").classList.add("hidden")}}
window.editItem=id=>fill(items.find(x=>x.id===id));
window.quick=async(id,action)=>{const x=items.find(x=>x.id===id);x.banned=action==="ban";x.bannedAt=x.banned?new Date().toISOString():null;await api("/api/admin",{method:"PUT",body:JSON.stringify(x)});await load()};
window.removeItem=async id=>{if(!confirm("Delete this subscription?"))return;await api("/api/admin?id="+encodeURIComponent(id),{method:"DELETE"});await load()};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginErr").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("pass").value="";await load()}catch(err){$("loginErr").textContent=err.message}};
$("form").onsubmit=async e=>{e.preventDefault();const x={id:$("id").value||undefined,name:$("name").value,email:$("email").value,plan:$("plan").value,status:$("status").value,startAt:$("startAt").value?new Date($("startAt").value).toISOString():null,endAt:$("endAt").value?new Date($("endAt").value).toISOString():null,banned:$("bannedCheck").checked,notes:$("notes").value};await api("/api/admin",{method:"PUT",body:JSON.stringify(x)});fill(null);await load()};
$("new").onclick=()=>fill(null);$("refresh").onclick=load;$("search").oninput=render;$("logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});location.reload()};load();setInterval(render,30000);
</script></body></html>
