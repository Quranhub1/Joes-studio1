<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOES STUDIO Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5e7eb}button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-family:Georgia,serif;font-size:28px;font-weight:800}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}.panel,.stat{background:#111827;border:1px solid #263244;border-radius:16px;padding:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat b{display:block;font-size:26px;margin-top:7px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{background:#243044;color:#e5e7eb;border:0;border-radius:9px;padding:9px 13px;font-weight:800}.tab.active{background:#d6b36a;color:#111827}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{width:100%;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:9px;padding:10px}.toolbar input{max-width:330px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#d6b36a;color:#111827;font-weight:800}.btn.dark{background:#243044;color:#e5e7eb}.btn.danger{background:#7f1d1d;color:#fff}.btn.green{background:#166534;color:#fff}.form{display:grid;gap:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.login{max-width:420px;margin:12vh auto}.hidden{display:none}.badge{padding:4px 8px;border-radius:999px;background:#243044}.active,.approved{background:#14532d}.pending{background:#713f12}.banned,.rejected{background:#7f1d1d}.row-actions{display:flex;gap:6px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #263244;font-size:13px;vertical-align:top}.count{font-variant-numeric:tabular-nums;color:#d6b36a;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid #263244;border-radius:12px;padding:14px;background:#0b1220}.card h3{margin:0 0 8px}.small{font-size:12px}.loginerr{min-height:18px;color:#fca5a5;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body>
<div id="login" class="panel login"><div class="brand">JOES STUDIO</div><p class="muted">Administration Console</p><form id="loginForm" class="form"><input id="adminUser" placeholder="Admin username" autocomplete="username" required><input id="adminPass" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="btn">Sign in</button><div id="loginErr" class="loginerr"></div></form></div>
<div id="app" class="shell hidden">
<div class="top"><div><div class="brand">JOES STUDIO</div><div class="muted">Users, payments, plans and usage</div></div><button id="logout" class="btn dark">Log out</button></div>
<div class="stats"><div class="stat">Users<b id="statUsers">0</b></div><div class="stat">Pending payments<b id="statPayments">0</b></div><div class="stat">Pro users<b id="statPro">0</b></div><div class="stat">Banned<b id="statBanned">0</b></div><div class="stat">Free usage<b id="statUsage">0</b></div></div>
<div class="tabs"><button class="tab active" data-tab="users">Users</button><button class="tab" data-tab="payments">Payments</button><button class="tab" data-tab="plans">Plans</button><button class="tab" data-tab="usage">Usage</button></div>
<section id="tab-users" class="panel"><div class="toolbar"><input id="userSearch" placeholder="Search name or email"><button id="refresh" class="btn dark">Refresh</button></div><table><thead><tr><th>User</th><th>Plan</th><th>Usage</th><th>Status</th><th>Actions</th></tr></thead><tbody id="userRows"></tbody></table></section>
<section id="tab-payments" class="panel hidden"><div class="toolbar"><button id="refreshPayments" class="btn dark">Refresh</button></div><table><thead><tr><th>User</th><th>Amount</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead><tbody id="paymentRows"></tbody></table></section>
<section id="tab-plans" class="panel hidden"><div class="cards"><div class="card"><h3>Free</h3><label class="small muted">Monthly batch limit<input id="freeLimit" type="number" min="0"></label></div><div class="card"><h3>Pro</h3><p class="small muted">Unlimited batch export, no watermark.</p><label class="small muted">Price<input id="proPrice"></label></div></div><button id="savePlans" class="btn" style="margin-top:14px">Save plan settings</button></section>
<section id="tab-usage" class="panel hidden"><div class="toolbar"><input id="usageSearch" placeholder="Search user"><button id="resetVisible" class="btn dark">Reset matching usage</button></div><table><thead><tr><th>User</th><th>Plan</th><th>Period</th><th>Used</th><th>Limit</th></tr></thead><tbody id="usageRows"></tbody></table></section>
</div>
<script>
let data={users:[],payments:[],plans:{}};const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function renderUsers(){
  const q=$("userSearch").value.toLowerCase();
  const rows=data.users.filter(u=>(u.name+" "+u.email).toLowerCase().includes(q));
  $("userRows").innerHTML=rows.map(u=>{
    const p=u.plan||{}, usage=u.usage||{};
    if(u.protected){
      return '<tr><td><b>'+esc(u.name||"Administrator")+'</b><br><span class="muted">'+esc(u.email)+'</span><br><span class="small muted">Protected system account</span></td><td><span class="badge">pro</span><br><span class="small muted">active · permanent</span></td><td>∞</td><td><span class="badge active">ACTIVE</span></td><td><span class="small muted">Protected · no ban, delete, plan or reset actions</span></td></tr>';
    }
    const id=JSON.stringify(String(u.id));
    const nextTier=JSON.stringify(p.tier==="pro"?"free":"pro");
    const banned=JSON.stringify(!u.banned);
    return '<tr><td><b>'+esc(u.name||"Unnamed")+'</b><br><span class="muted">'+esc(u.email)+'</span></td><td><span class="badge">'+esc(p.tier)+'</span><br><span class="small muted">'+esc(p.status)+'</span></td><td>'+esc(usage.batchesUsed||0)+' / '+(p.tier==="pro"?"∞":esc(usage.batchLimit||data.plans.free?.batchLimit||3))+'</td><td><span class="badge '+(u.banned?"banned":"active")+'">'+(u.banned?"BANNED":"ACTIVE")+'</span></td><td class="row-actions"><button class="btn" onclick="togglePro('+id+','+nextTier+')">'+(p.tier==="pro"?"Free":"Pro")+'</button><button class="btn dark" onclick="toggleBan('+id+','+banned+')">'+(u.banned?"Unban":"Ban")+'</button><button class="btn dark" onclick="resetUsage('+id+')">Reset</button><button class="btn danger" onclick="deleteUser('+id+')">Delete</button></td></tr>';
  }).join("");
}
function renderPayments(){$("paymentRows").innerHTML=data.payments.map(p=>'<tr><td><b>'+esc(p.name||"")+'</b><br><span class="muted">'+esc(p.email)+'</span></td><td>'+esc(p.currency||"")+" "+esc(p.amount||"")+'</td><td>'+esc(p.reference)+'</td><td><span class="badge '+esc(p.status)+'">'+esc(p.status)+'</span></td><td class="row-actions">'+(p.status==="pending"?'<button class="btn green" onclick="resolvePayment(\''+p.id+'\',\'approved\')">Approve</button><button class="btn danger" onclick="resolvePayment(\''+p.id+'\',\'rejected\')">Reject</button>':"")+'</td></tr>').join("")||'<tr><td colspan="5" class="muted">No payment requests.</td></tr>'}
function renderUsage(){const q=$("usageSearch").value.toLowerCase();$("usageRows").innerHTML=data.users.filter(u=>(u.name+" "+u.email).toLowerCase().includes(q)).map(u=>{const x=u.usage||{};return '<tr><td>'+esc(u.name||"Unnamed")+'<br><span class="muted">'+esc(u.email)+'</span></td><td>'+esc(u.plan?.tier||"free")+'</td><td>'+esc(x.periodKey||"")+'</td><td>'+esc(x.batchesUsed||0)+'</td><td>'+esc(u.plan?.tier==="pro"?"∞":x.batchLimit||data.plans.free?.batchLimit||3)+'</td></tr>'}).join("")}
function render(){ $("statUsers").textContent=data.users.length;$("statPayments").textContent=data.payments.filter(x=>x.status==="pending").length;$("statPro").textContent=data.users.filter(x=>x.plan?.tier==="pro").length;$("statBanned").textContent=data.users.filter(x=>x.banned).length;$("statUsage").textContent=data.users.filter(x=>x.plan?.tier!=="pro").reduce((n,x)=>n+Number(x.usage?.batchesUsed||0),0);renderUsers();renderPayments();renderUsage();$("freeLimit").value=data.plans.free?.batchLimit??3;$("proPrice").value=data.plans.pro?.price??""}
async function load(){try{data=await api("/api/admin");$("login").classList.add("hidden");$("app").classList.remove("hidden");render()}catch(e){$("login").classList.remove("hidden");$("app").classList.add("hidden")}}
window.togglePro=async(id,tier)=>{await api("/api/admin?action=user",{method:"PUT",body:JSON.stringify({id,tier,duration:"monthly"})});await load()};
window.toggleBan=async(id,banned)=>{await api("/api/admin?action=user",{method:"PUT",body:JSON.stringify({id,banned})});await load()};
window.resetUsage=async id=>{await api("/api/admin?action=user",{method:"PUT",body:JSON.stringify({id,resetUsage:true})});await load()};
window.deleteUser=async id=>{if(confirm("Delete this user and invalidate their sessions?")){await api("/api/admin?id="+encodeURIComponent(id),{method:"DELETE"});await load()}};
window.resolvePayment=async(id,status)=>{await api("/api/admin?action=payment",{method:"PUT",body:JSON.stringify({id,status})});await load()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("section[id^=tab-]").forEach(x=>x.classList.add("hidden"));$("tab-"+b.dataset.tab).classList.remove("hidden")});
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginErr").textContent="";try{await api("/api/admin?action=login",{method:"POST",body:JSON.stringify({username:$("adminUser").value,password:$("adminPass").value})});$("adminPass").value="";await load()}catch(err){$("loginErr").textContent=err.message}};
$("logout").onclick=async()=>{await api("/api/admin?action=logout",{method:"POST"});location.reload()};
$("refresh").onclick=load;$("refreshPayments").onclick=load;$("userSearch").oninput=renderUsers;$("usageSearch").oninput=renderUsage;
$("savePlans").onclick=async()=>{await api("/api/admin?action=plans",{method:"PUT",body:JSON.stringify({free:{batchLimit:Number($("freeLimit").value)},pro:{price:$("proPrice").value}})});await load()};
$("resetVisible").onclick=async()=>{const q=$("usageSearch").value.toLowerCase();for(const u of data.users.filter(x=>(x.name+" "+x.email).toLowerCase().includes(q)))await resetUsage(u.id)};
load();
</script></body></html>
