<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOES STUDIO Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5e7eb}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1400px;margin:auto;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-family:Georgia,serif;font-size:28px;font-weight:800;letter-spacing:1px}.muted{color:#94a3b8}
.grid{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel,.stat{background:#111827;border:1px solid #263244;border-radius:16px;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat b{display:block;font-size:28px;margin-top:7px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{width:100%;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:9px;padding:10px}.toolbar input{max-width:330px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#d6b36a;color:#111827;font-weight:800}.btn.dark{background:#243044;color:#e5e7eb}.btn.danger{background:#7f1d1d;color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #263244;font-size:14px}.badge{padding:4px 8px;border-radius:999px;background:#243044}.active{background:#14532d}.pending{background:#713f12}.banned{background:#7f1d1d}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}
.form{display:grid;gap:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.login{max-width:420px;margin:12vh auto}.count{font-variant-numeric:tabular-nums;color:#d6b36a;font-weight:800}.side h3{margin-top:0}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body>
<div id="login" class="panel login"><div class="brand">JOES STUDIO</div><p class="muted">Administration Console</p>
<form id="loginForm" class="form"><input id="user" placeholder="Admin username" autocomplete="username" required><input id="pass" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="btn">Sign in</button><div id="loginErr" class="muted"></div></form></div>
<div id="app" class="shell hidden"><div class="top"><div><div class="brand">JOES STUDIO</div><div class="muted">User & Subscription Administration</div></div><button id="logout" class="btn dark">Log out</button></div>
<div class="stats"><div class="stat">Total<b id="total">0</b></div><div class="stat">Pro<b id="pro">0</b></div><div class="stat">Active<b id="active">0</b></div><div class="stat">Banned<b id="banned">0</b></div></div>
<div class="grid"><aside class="panel side"><h3>User</h3><form id="form" class="form"><input id="id" type="hidden"><input id="name" placeholder="Name"><input id="email" type="email" placeholder="Email" required><div class="formgrid"><select id="tier"><option value="free">Free</option><option value="pro">Pro</option></select><select id="status"><option value="active">Active</option><option value="pending">Pending</option><option value="expired">Expired</option><option value="cancelled">Cancelled</option></select></div><div class="formgrid"><label class="muted">Plan duration<select id="planDuration"><option value="">None</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label class="muted">Batch limit<input id="batchLimit" type="number" min="0" step="1"></label></div><label><input id="bannedCheck" type="checkbox" style="width:auto"> Banned</label><input id="bannedReason" placeholder="Ban reason (optional)"><button class="btn">Save user</button><button type="button" id="resetBatches" class="btn dark">Reset batch usage</button><button type="button" id="new" class="btn dark">New</button></form></aside>
<main class="panel"><div class="toolbar"><input id="search" placeholder="Search name or email"><button id="refresh" class="btn dark">Refresh</button></div><table><thead><tr><th>User</th><th>Tier</th><th>Status</th><th>Usage</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></main></div></div>
<script>
let items=[];
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function render(){const q=$("search").value.toLowerCase();const list=items.filter(x=>(x.name+" "+x.email).toLowerCase().includes(q));$("total").textContent=items.length;$("pro").textContent=items.filter(x=>x.subscription?.tier==="pro").length;$("active").textContent=items.filter(x=>x.subscription?.status==="active").length;$("banned").textContent=items.filter(x=>x.banned).length;
$("rows").innerHTML=list.map(x=>`<tr><td><b>${esc(x.name||"Unnamed")}</b><br><span class="muted">${esc(x.email)}</span></td><td><span class="badge ${x.subscription?.tier==="pro"?"active":""}">${esc(x.subscription?.tier||"free")}</span></td><td><span class="badge ${x.banned?"banned":x.subscription?.status||"active"}">${x.banned?"BANNED":esc(x.subscription?.status||"active")}</span></td><td class="count">${x.subscription?.batchesUsed||0} / ${x.subscription?.batchLimit||3}</td><td class="row-actions"><button class="btn" onclick="editItem('${x.id}')">Edit</button><button class="btn dark" onclick="quick('${x.id}','${x.banned?"unban":"ban"}')">${x.banned?"Unban":"Ban"}</button><button class="btn danger" onclick="removeItem('${x.id}')">Delete</button></td></tr>`).join("")}
function fill(x){$("id").value=x?.id||"";$("name").value=x?.name||"";$("email").value=x?.email||"";$("tier").value=x?.subscription?.tier||"free";$("status").value=x?.subscription?.status||"active";$("planDuration").value="";$("batchLimit").value=x?.subscription?.batchLimit||3;$("bannedCheck").checked=!!x?.banned;$("bannedReason").value=x?.bannedReason||""}
async function load(){try{const d=await api("/api/subscriptions");items=d.users||[];$("login").classList.add("hidden");$("app").classList.remove("hidden");render()}catch(e){$("login").classList.remove("hidden");$("app").classList.add("hidden")}}
window.editItem=id=>fill(items.find(x=>x.id===id));
window.quick=async(id,action)=>{const x=items.find(x=>x.id===id);if(!x)return;x.banned=action==="ban";x.bannedReason=x.banned?(x.bannedReason||"Banned by admin"):null;await api("/api/subscriptions",{method:"PUT",body:JSON.stringify({userId:id,banned:x.banned,bannedReason:x.bannedReason})});await load()};
window.removeItem=async id=>{if(!confirm("Delete this user? This cannot be undone."))return;await api("/api/subscriptions?userId="+encodeURIComponent(id),{method:"DELETE"});await load()};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginErr").textContent="";try{await api("/api/admin?action=login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("pass").value="";await load()}catch(err){$("loginErr").textContent=err.message}};
$("form").onsubmit=async e=>{e.preventDefault();const userId=$("id").value;if(!userId)return;const payload={userId,tier:$("tier").value,status:$("status").value,banned:$("bannedCheck").checked,bannedReason:$("bannedReason").value,planDuration:$("planDuration").value,batchLimit:Number($("batchLimit").value)||0};await api("/api/subscriptions",{method:"PUT",body:JSON.stringify(payload)});fill(null);await load()};
$("resetBatches").onclick=async()=>{const userId=$("id").value;if(!userId)return;if(!confirm("Reset batch usage for this user?"))return;await api("/api/subscriptions",{method:"PUT",body:JSON.stringify({userId,resetBatches:true})});await load()};
$("new").onclick=()=>fill(null);$("refresh").onclick=load;$("search").oninput=render;$("logout").onclick=async()=>{await api("/api/admin?action=logout",{method:"POST"});location.reload()};load();setInterval(render,30000);
</script></body></html>
