<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bold Event Poster</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Inter,Arial,sans-serif;color:#172033}
.canvas{width:900px;min-height:1100px;margin:24px auto;padding:42px;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#f8fafc 65%,#eef2ff 100%);box-shadow:0 18px 50px rgba(15,23,42,.14)}
.canvas:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-130px;top:-150px;background:#0f766e;opacity:.12}
.canvas:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-120px;bottom:-150px;background:#14b8a6;opacity:.12}
.brand{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#0f766e}
h1{font-size:48px;line-height:1.02;margin:12px 0 10px;letter-spacing:-.04em}h2{font-size:25px;margin:0 0 12px}p{color:#64748b;line-height:1.6}
.line{height:5px;width:90px;background:linear-gradient(90deg,#0f766e,#14b8a6);border-radius:10px;margin:20px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:rgba(255,255,255,.84);border:1px solid #e2e8f0;border-radius:20px;padding:24px}.pill{display:inline-block;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid #dbe3ef;color:#0f766e;font-weight:800;font-size:12px}
.photo{width:150px;height:180px;border-radius:18px;background:linear-gradient(145deg,#cbd5e1,#94a3b8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.logo{width:86px;height:86px;border-radius:24px;background:linear-gradient(145deg,#0f766e,#14b8a6);display:flex;align-items:center;justify-content:center;color:white;font-size:28px;font-weight:900;box-shadow:0 12px 25px rgba(15,23,42,.16)}
.signature{border-top:1px solid #cbd5e1;padding-top:8px;color:#64748b;font-size:12px}
.footer{position:absolute;left:42px;right:42px;bottom:30px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#64748b}
.bigcenter{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:650px}
.price{font-size:42px;font-weight:900;color:#0f766e}
table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}
</style></head><body>
<div class="canvas">
<div class="brand">JOES STUDIO • Flyers & Posters</div>
<div style="margin-top:70px;max-width:680px"><span class="pill">SPECIAL EVENT</span><h1 style="font-size:62px">Bold Event Poster</h1><p style="font-size:21px">A polished, ready-to-edit layout for campaigns, launches, school events and promotions.</p><div class="grid" style="margin-top:45px"><div class="panel"><h2>DATE</h2><p>{{sitting}}</p></div><div class="panel"><h2>VENUE</h2><p>{{course}}</p></div></div></div>
<div class="footer"><span>Editable Joes Studio template</span><span>Replace the {{fields}} with your information</span></div>
</div></body></html>
