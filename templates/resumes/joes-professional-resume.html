<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:210mm;min-height:297mm;background:#fff;color:#182230;display:grid;grid-template-columns:62mm 1fr}.side{background:#152b3c;color:#fff;padding:13mm}.main{padding:13mm 15mm}.name{font-size:23px;font-weight:900}.role{font-size:9px;color:#b9d9e8;margin-top:2mm}.photo{width:35mm;height:35mm;border-radius:50%;background:#ddd;object-fit:cover;margin-bottom:9mm}.h{font-size:8px;letter-spacing:2px;font-weight:900;text-transform:uppercase;color:#159c91;margin:7mm 0 3mm}.side .h{color:#8ddbd2}.text{font-size:8px;line-height:1.7}.main .name{font-size:27px}.section{margin-bottom:8mm}.item{font-size:10px;font-weight:800;margin-top:4mm}.muted{font-size:8px;color:#657181;line-height:1.6}</style></head><body><div class="card"><aside class="side"><img class="photo" data-field="Photo" src=""><div class="h">Contact</div><div class="text">{{Phone}}<br>{{Email}}<br>{{Website}}<br>{{Address}}</div><div class="h">Skills</div><div class="text">{{Skills}}</div><div class="h">Education</div><div class="text">{{Education}}</div></aside><main class="main"><div class="name">{{Full Name}}</div><div class="role">{{Professional Title}}</div><div class="h">Profile</div><div class="text">{{Profile}}</div><div class="h">Experience</div><div class="section"><div class="item">{{Job One}}</div><div class="muted">{{Job One Details}}</div><div class="item">{{Job Two}}</div><div class="muted">{{Job Two Details}}</div></div><div class="h">References</div><div class="text">{{References}}</div></main></div></body></html>
