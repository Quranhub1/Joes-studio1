<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:210mm;min-height:297mm;background:#fff;padding:17mm 20mm;color:#25313d}.head{display:flex;justify-content:space-between;border-bottom:2px solid #147b73;padding-bottom:6mm}.brand{font-size:18px;font-weight:900}.tag{font-size:7px;letter-spacing:2px;color:#147b73;margin-top:1mm}.contact{text-align:right;font-size:7px;line-height:1.7}.date{margin-top:15mm;font-size:9px}.subject{font-size:14px;font-weight:900;margin:10mm 0 6mm}.body{font-size:10px;line-height:1.9;white-space:pre-line;min-height:155mm}.sign{font-size:9px;border-top:1px solid #8793a0;width:55mm;padding-top:2mm}.foot{border-top:1px solid #dce2e7;margin-top:15mm;padding-top:4mm;font-size:7px;color:#71808d;text-align:center}</style></head><body><div class="card"><header class="head"><div><div class="brand">{{Organization}}</div><div class="tag">{{Tagline}}</div></div><div class="contact">{{Address}}<br>{{Phone}}<br>{{Email}}<br>{{Website}}</div></header><div class="date">{{Date}}</div><div class="subject">{{Subject}}</div><div class="body">{{Letter Body}}</div><div class="sign">{{Sender Name}}<br>{{Sender Title}}</div><div class="foot">{{Footer}}</div></div></body></html>
