<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:297mm;height:210mm;background:#fff;padding:12mm;color:#1d2935}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #1b7d76;padding-bottom:5mm}.year{font-size:34px;font-weight:900}.brand{font-size:8px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2mm;margin-top:8mm}.day{height:21mm;border:1px solid #d8e0e6;padding:2mm;font-size:8px}.num{font-weight:900}.month{grid-column:1/-1;font-size:16px;font-weight:900;padding:3mm 0}.note{font-size:6px;color:#74818d;margin-top:2mm}</style></head><body><div class="card"><div class="head"><div class="brand">{{Organization}}</div><div class="year">{{Year}}</div></div><div class="grid"><div class="month">{{Month}}</div><div class="day"><div class="num">1</div>{{Day 1}}</div><div class="day"><div class="num">2</div>{{Day 2}}</div><div class="day"><div class="num">3</div>{{Day 3}}</div><div class="day"><div class="num">4</div>{{Day 4}}</div><div class="day"><div class="num">5</div>{{Day 5}}</div><div class="day"><div class="num">6</div>{{Day 6}}</div><div class="day"><div class="num">7</div>{{Day 7}}</div><div class="day"><div class="num">8</div>{{Day 8}}</div><div class="day"><div class="num">9</div>{{Day 9}}</div><div class="day"><div class="num">10</div>{{Day 10}}</div></div></div></body></html>
