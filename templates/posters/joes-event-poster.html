<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:210mm;height:297mm;background:radial-gradient(circle at 75% 20%,#1f6b76,#101923 55%);color:#fff;padding:18mm;position:relative;overflow:hidden;text-align:center}.tag{font-size:9px;letter-spacing:4px;font-weight:900}.title{font-size:48px;line-height:.95;font-weight:900;margin:35mm 0 7mm}.desc{font-size:13px;line-height:1.5}.date{font-size:16px;font-weight:900;margin-top:12mm}.venue{font-size:10px;margin-top:3mm}.footer{position:absolute;bottom:14mm;left:18mm;right:18mm;font-size:8px;display:flex;justify-content:space-between}</style></head><body><div class="card"><div class="tag">{{Organization}}</div><div class="title">{{Event Name}}</div><div class="desc">{{Event Description}}</div><div class="date">{{Date}} • {{Time}}</div><div class="venue">{{Venue}}</div><div class="footer"><span>{{Website}}</span><span>{{Phone}}</span></div></div></body></html>
