<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:90mm;height:55mm;background:#111827;color:#fff;padding:7mm;position:relative;overflow:hidden}.accent{position:absolute;right:-15mm;top:-15mm;width:45mm;height:45mm;border-radius:50%;background:#18b6a4}.brand{font-size:7px;letter-spacing:2px;color:#b9f3eb}.name{margin-top:13mm;font-size:17px;font-weight:800}.role{font-size:7px;color:#9ca3af;margin-top:1mm}.contact{position:absolute;bottom:7mm;left:7mm;font-size:6px;line-height:1.8}.mark{position:absolute;right:7mm;bottom:7mm;font-size:8px;font-weight:900}</style></head><body><div class="card"><div class="accent"></div><div class="brand">{{Company}}</div><div class="name">{{Full Name}}</div><div class="role">{{Job Title}}</div><div class="contact">{{Phone}}<br>{{Email}}<br>{{Website}}<br>{{Address}}</div><div class="mark">{{Initials}}</div></div></body></html>
