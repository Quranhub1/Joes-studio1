<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:86mm;height:54mm;position:relative;overflow:hidden;border-radius:4mm;background:linear-gradient(135deg,#0b1220,#123b63);color:#fff;padding:5mm}.top{display:flex;align-items:center;gap:3mm}.logo{width:9mm;height:9mm;border:1px solid #fff8;border-radius:2mm;display:grid;place-items:center;font-size:5px}.brand{font-size:9px;font-weight:800;letter-spacing:.8px}.role{font-size:6px;color:#b9d8ff}.body{display:flex;gap:4mm;margin-top:4mm}.photo{width:24mm;height:30mm;border-radius:2mm;background:#dce6ef;object-fit:cover;border:1mm solid #fff}.info{font-size:7px;line-height:1.8}.name{font-size:12px;font-weight:800;line-height:1.1;margin-bottom:2mm}.label{color:#9fc5e8;font-size:5px;text-transform:uppercase}.footer{position:absolute;bottom:3mm;left:5mm;right:5mm;font-size:5px;display:flex;justify-content:space-between;color:#b8d2e8}</style></head><body><div class="card"><div class="top"><div class="logo">LOGO</div><div><div class="brand">{{Organization}}</div><div class="role">IDENTIFICATION CARD</div></div></div><div class="body"><img class="photo" data-field="Photo" src="" alt=""><div class="info"><div class="name">{{Full Name}}</div><div><span class="label">Position</span><br>{{Position}}</div><div><span class="label">ID Number</span><br>{{ID Number}}</div><div><span class="label">Department</span><br>{{Department}}</div></div></div><div class="footer"><span>{{Phone}}</span><span>{{Expiry Date}}</span></div></div></body></html>
