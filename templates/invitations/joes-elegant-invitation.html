<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Georgia,serif}.card{width:148mm;height:210mm;background:#fbf6ed;border:2mm solid #1d3945;padding:16mm;text-align:center;color:#1d3945;position:relative}.orn{font-size:24px;color:#b58b38}.small{font:700 8px Arial;letter-spacing:3px;margin-top:12mm}.title{font-size:30px;margin:8mm 0}.name{font-size:27px;font-style:italic}.details{font-size:11px;line-height:1.8;margin-top:12mm}.footer{position:absolute;bottom:13mm;left:16mm;right:16mm;font:8px Arial;display:flex;justify-content:space-between}</style></head><body><div class="card"><div class="orn">✦</div><div class="small">{{Host}}</div><div class="title">{{Event Type}}</div><div class="name">{{Guest of Honor}}</div><div class="details">{{Invitation Text}}<br><b>{{Date}}</b><br>{{Time}} • {{Venue}}<br>{{Address}}</div><div class="footer"><span>{{RSVP}}</span><span>{{Phone}}</span></div></div></body></html>
