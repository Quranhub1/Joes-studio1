<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:210mm;height:297mm;background:linear-gradient(160deg,#101827 0 55%,#f2a900 55%);color:#fff;padding:18mm;position:relative;overflow:hidden}.eyebrow{font-size:9px;font-weight:800;letter-spacing:3px}.headline{font-size:42px;line-height:.95;font-weight:900;margin-top:10mm;max-width:150mm}.sub{font-size:14px;line-height:1.5;max-width:130mm;margin-top:7mm}.offer{margin-top:15mm;font-size:22px;font-weight:900}.cta{position:absolute;bottom:16mm;left:18mm;font-size:10px;font-weight:800}.date{position:absolute;bottom:16mm;right:18mm;font-size:9px}</style></head><body><div class="card"><div class="eyebrow">{{Organization}}</div><div class="headline">{{Headline}}</div><div class="sub">{{Description}}</div><div class="offer">{{Offer}}</div><div class="cta">{{Phone}} • {{Website}}</div><div class="date">{{Date}}</div></div></body></html>
