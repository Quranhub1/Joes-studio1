<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KSHS Sunset Orange</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef2f7}body{font-family:Inter,Arial,sans-serif}.card{width:130mm;height:60mm;position:relative;overflow:hidden;margin:0 auto;background:#fff;color:#172033;border-radius:2.5mm;box-shadow:0 12px 30px #0f172a38;isolation:isolate}.card:before,.card:after{content:"";position:absolute;pointer-events:none;z-index:0}.content{position:relative;z-index:3}.brand{position:absolute;left:5mm;top:4mm;display:flex;align-items:center;gap:2.5mm;color:#fff}.mark{width:11mm;height:11mm;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:8pt;background:#ffffff2e;border:1px solid #ffffffa6;box-shadow:0 0 0 1.5mm #ffffff14}.school{font-size:10.5pt;font-weight:900;line-height:1.02;text-transform:uppercase}.title{font-size:6.8pt;font-weight:700;opacity:.82;margin-top:1mm;letter-spacing:1.5px;text-transform:uppercase}.photo{position:absolute;z-index:4;width:24mm;height:28mm;overflow:hidden;background:#fff;border:2px solid #fffffff0;box-shadow:0 5px 16px #0000003d}.photo img{width:100%;height:100%;object-fit:cover;display:block}.details{position:absolute;z-index:4;display:flex;flex-direction:column;gap:1.15mm}.row{display:grid;grid-template-columns:18mm 1fr;gap:1.8mm;align-items:end;font-size:7.2pt;line-height:1.05}.row span{font-size:5.6pt;font-weight:900;letter-spacing:.8px;opacity:.62}.row b{font-size:7.3pt;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #0000002e;padding-bottom:.45mm}.note{position:absolute;z-index:4;font-size:4.8pt;line-height:1.1;font-weight:700;max-width:78mm}.issuer{position:absolute;z-index:4;font-size:5.2pt;font-weight:700}.footer{position:absolute;z-index:4;font-size:6pt;font-weight:900;letter-spacing:1.3px}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(150%)}}.card:after{width:28mm;height:100%;top:0;left:-40mm;background:linear-gradient(90deg,transparent,#ffffff3d,transparent);transform:skewX(-18deg);animation:sweep 5s ease-in-out infinite}.photo{animation:float 5s ease-in-out infinite}@media print{html,body{background:#fff}.card{box-shadow:none;border-radius:0;break-inside:avoid;page-break-inside:avoid}.card:after,.photo{animation:none!important}}.card:before{right:-10mm;top:-12mm;width:45mm;height:45mm;border-radius:50%;background:#fff2;box-shadow:-8mm 20mm 0 -5mm #ffffff14}.details{left:6mm;right:36mm;top:23mm}.photo{right:6mm;top:21mm;border-radius:12mm 2mm}.note,.issuer{left:6mm;color:white}.note{bottom:5mm}.issuer{bottom:1.8mm}.footer{right:6mm;bottom:2mm;color:white}</style></head><body><div class="card" style="background:linear-gradient(135deg,#7c2d12,#ea580c,#f59e0b)"><div class="content"><div class="brand"><div class="mark">K</div><div><div class="school">Kampala School of Health Sciences</div><div class="title">Examination Card</div></div></div><div class="photo"><img data-bind-src="photo" src="{{photo}}" alt="Student passport photo"></div><div class="details"><div class="row"><span>NAME</span><b>{{name}}</b></div><div class="row"><span>REG NO</span><b>{{reg no}}</b></div><div class="row"><span>SEX</span><b>{{sex}}</b></div><div class="row"><span>SITTING</span><b>{{sitting}}</b></div><div class="row"><span>COURSE</span><b>{{course}}</b></div></div><div class="note">NOTE: This card is void to duplication and any intent to that may lead to expulsion.</div><div class="issuer">Issued by: __________________________</div><div class="footer">KSHS • 12</div></div></div></body></html>
