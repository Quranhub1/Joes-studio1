<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSHS Examination Card Template</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .exam-card {
            width: 130mm;
            height: 60mm;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            border: 1.5px solid #000000;
            background: #d8eeee;
            font-family: "Tinos", "Times New Roman", Times, serif;
            color: #000000;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
        }

        .paper-teal {
            background-color: #d8eeee !important;
        }

        .paper-white {
            background-color: #ffffff !important;
        }

        /* BADGE */
        .card-badge {
            position: absolute;
            left: 4mm;
            top: 3.5mm;
            width: 17mm;
            height: 17mm;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* HEADER */
        .card-header {
            position: absolute;
            left: 23mm;
            right: 4mm;
            top: 3.5mm;
            text-align: center;
        }

        .school-name {
            margin: 0;
            font-size: 11.5pt;
            line-height: 1.05;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .exam-title {
            margin-top: 1.2mm;
            font-size: 10pt;
            line-height: 1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* PASSPORT PHOTO BOX */
        .passport-photo {
            position: absolute;
            left: 4mm;
            top: 22mm;
            width: 22mm;
            height: 27mm;
            border: 1px solid #000000;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .passport-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-placeholder {
            font-family: Arial, sans-serif;
            font-size: 6.5pt;
            line-height: 1.2;
            text-align: center;
            color: #555555;
            position: absolute;
            z-index: 1;
        }

        /* STUDENT DETAILS */
        .student-details {
            position: absolute;
            left: 28mm;
            right: 4mm;
            top: 20.5mm;
        }

        .detail-row {
            display: flex;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 1.2mm;
            font-size: 8.5pt;
            line-height: 1;
        }

        .detail-label {
            width: 17mm;
            flex-shrink: 0;
            font-weight: 700;
            text-transform: uppercase;
        }

        .detail-value {
            flex: 1;
            min-width: 0;
            min-height: 1.1em;
            font-weight: 400;
            border-bottom: 0.5px solid #000000;
            padding-left: 1mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-note {
            position: absolute;
            left: 28mm;
            right: 4mm;
            bottom: 7mm;
            font-size: 6pt;
            line-height: 1.05;
            font-weight: 700;
            text-align: left;
        }

        .issued-by {
            position: absolute;
            left: 28mm;
            bottom: 2.5mm;
            font-size: 6.5pt;
        }

        .issued-by-label {
            font-weight: 700;
        }

        .card-footer {
            position: absolute;
            right: 4mm;
            bottom: 2.5mm;
            font-size: 6.5pt;
            font-weight: 700;
        }

        @media print {
            body { 
                margin: 0; 
                padding: 0; 
                background: #ffffff; 
                min-height: auto;
            }
            .exam-card { 
                box-shadow: none; 
                break-inside: avoid; 
                page-break-inside: avoid; 
            }
        }
    </style>
</head>

<body>
    <div class="exam-card paper-teal" id="exam-card">
        <!-- Badge: Static logo -->
        <div class="card-badge">
            <img class="badge-img" src="https://www.kshs.ac.ug/images/kampala%20logo.png" alt="KSHS Badge">
        </div>

        <div class="card-header">
            <h1 class="school-name">KAMPALA SCHOOL OF HEALTH SCIENCES</h1>
            <div class="exam-title">EXAMINATION CARD</div>
        </div>

        <!-- Photo Box -->
        <div class="passport-photo">
            <span id="photo-placeholder" class="photo-placeholder"></span>
            <img id="out-photo" data-bind-src="photo" src="{{photo}}" alt="Student Passport Photo">
        </div>

        <!-- Student Data -->
        <div class="student-details">
            <div class="detail-row">
                <div class="detail-label">NAME</div>
                <div class="detail-value" id="out-name">{{name}}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">REG NO</div>
                <div class="detail-value" id="out-regno">{{reg no}}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">SEX</div>
                <div class="detail-value" id="out-sex">{{sex}}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">SITTING</div>
                <div class="detail-value" id="out-sitting">{{sitting}}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">COURSE</div>
                <div class="detail-value" id="out-course">{{course}}</div>
            </div>
        </div>

        <div class="card-note">
            NOTE: This card is void to duplication and any intent to that may lead to expulsion.
        </div>

        <div class="issued-by">
            <span class="issued-by-label">Issued by:</span>
            <span id="out-issuedby">______________________________________</span>
        </div>

        <div class="card-footer">KSHS</div>
    </div>
</body>
</html>
