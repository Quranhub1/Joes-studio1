<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:297mm;height:210mm;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);color:#182334}.panel{padding:14mm;border-right:1px solid #dbe3ea}.panel:last-child{border:0}.tag{font-size:7px;letter-spacing:2px;color:#157f78;font-weight:800}.title{font-size:22px;font-weight:900;margin:8mm 0}.text{font-size:9px;line-height:1.7;color:#526071}.contact{margin-top:15mm;font-size:8px}.feature{font-size:13px;font-weight:800;margin:7mm 0 2mm}</style></head><body><div class="card"><section class="panel"><div class="tag">DISCOVER</div><div class="title">{{Organization}}</div><div class="text">{{Headline}}</div><div class="contact">{{Website}}<br>{{Phone}}</div></section><section class="panel"><div class="tag">ABOUT US</div><div class="feature">{{Feature One}}</div><div class="text">{{Feature One Description}}</div><div class="feature">{{Feature Two}}</div><div class="text">{{Feature Two Description}}</div></section><section class="panel"><div class="tag">CONTACT</div><div class="title">{{Call To Action}}</div><div class="text">{{Description}}</div><div class="contact">{{Email}}<br>{{Address}}<br>{{Phone}}</div></section></div></body></html>
